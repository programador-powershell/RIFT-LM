name: Dashboard CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Compila TODOS os .py versionados (raiz, cascade/**, conversores, série
      # C3 quando presente). O glob é dinâmico via git ls-files, então arquivos
      # novos entram automaticamente — bugs classe NameError/SyntaxError não
      # passam despercebidos.
      - name: Python compile check (all tracked .py)
        run: |
          set -euo pipefail
          git ls-files -z '*.py' | xargs -0 --no-run-if-empty python -m py_compile
          echo "py_compile OK ($(git ls-files '*.py' | wc -l) arquivos)"

      - name: Build VLB native kernel/server
        run: |
          set -euo pipefail
          cmake -S engines/vlb/native -B /tmp/vlb-native-ci -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/vlb-native-ci --config Release -j2
          ctest --test-dir /tmp/vlb-native-ci --output-on-failure
          /tmp/vlb-native-ci/vlb-server --port 18787 >/tmp/vlb-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import json, time, urllib.request
          for _ in range(30):
              try:
                  body = urllib.request.urlopen('http://127.0.0.1:18787/healthz', timeout=1).read().decode()
                  obj = json.loads(body)
                  assert obj['ok'] is True
                  assert obj['external_llm_runtime'] is False
                  print(body)
                  break
              except Exception:
                  time.sleep(0.1)
          else:
              raise SystemExit('vlb-server healthz did not become ready')
          PY

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Smoke tests
        run: npm test
